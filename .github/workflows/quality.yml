name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore NoxoGraphics.csproj
      - run: dotnet build NoxoGraphics.csproj --configuration Release --no-restore
